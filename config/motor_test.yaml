bidirectional_motor_test:
  ros__parameters:
    # Actual EcatV2_Master slave sn2555957 topics.
    input_topic: "/ecat/sn2555957/app1/read"
    output_topic: "/ecat/sn2555957/app2/write"
    motor_channel: 1

    # 2=DISARM; 3=armed with DSHOT 0; 1=sinusoidal output.
    # The phase is frozen during reversal pauses; wall-time waveform
    # intentionally has zero-output plateaus near every sign change.
    sine_frequency_hz: 0.05
    sine_deadband: 0.08
    positive_peak_dshot: 1250
    negative_peak_dshot: 250
    invert_direction: false
    reversal_pause_sec: 2.0
    run_reentry_pause_sec: 2.0
    publish_rate_hz: 50.0
    rc_timeout_sec: 0.25

    # Optional rotor-stop guard. Enable and supply a real RPM ROS topic
    # before any propeller-on reversal experiments.
    # RPM topic message type: std_msgs/msg/Float64.
    rpm_topic: ""
    require_rpm_for_reversal: false
    rpm_stop_threshold: 100.0
    rpm_stable_sec: 0.3
    rpm_timeout_sec: 0.25

    # G10 LAN data does not automatically appear as a ROS topic.
    # Requires an independent bridge publishing std_msgs/msg/Float64.
    force_topic: ""
    force_unit: "kgf"
    force_forward_sign: 1
    force_sample_max_age_sec: 0.25
    force_change_threshold: 0.03
    force_sign_threshold: 0.03
    force_confirm_samples: 3
    force_latency_timeout_sec: 5.0

    log_directory: "~/bidirectional/measurements"
