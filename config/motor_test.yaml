bidirectional_motor_test:
  ros__parameters:
    # Actual EcatV2_Master slave sn2555957 topics.
    input_topic: "/ecat/sn2555957/app1/read"
    output_topic: "/ecat/sn2555957/app2/write"
    motor_channel: 1

    # RC authorization is unchanged in BOTH modes:
    # 2=DISARM, 3=ARMED (DSHOT 0), 1=RUN selected waveform.
    # sine (default): existing phase-frozen sine wave, fully unchanged.
    # step: hold an EQUAL 3D magnitude, then alternate direction.
    waveform_mode: "step"

    # Original sine mode (unaffected by step parameters).
    # The phase is frozen during reversal pauses; wall-time waveform
    # intentionally has zero-output plateaus near every sign change.
    sine_frequency_hz: 0.05
    sine_deadband: 0.0
    positive_peak_dshot: 1250
    negative_peak_dshot: 250
    invert_direction: false
    invert_direction: false

    # 原有正弦模式的换向等待时间
    reversal_pause_sec: 0.0

    # 新增 STEP 模式参数
    step_forward_dshot: 1250
    step_reverse_dshot: 250
    step_hold_sec: 2.0
    step_reversal_pause_sec: 0.0
    step_allow_direct_reversal: true

    run_reentry_pause_sec: 2.0
    publish_rate_hz: 50.0
    rc_timeout_sec: 0.25

    # Optional rotor-stop guard. Enable and supply a real RPM ROS topic
    # before any propeller-on reversal experiments.
    # RPM topic message type: std_msgs/msg/Float64.
    rpm_topic: ""
    require_rpm_for_reversal: false
    rpm_stop_threshold: 100.0
    rpm_stable_sec: 0.3
    rpm_timeout_sec: 0.25

    # G10 LAN data does not automatically appear as a ROS topic.
    # Requires an independent bridge publishing std_msgs/msg/Float64.
    force_topic: ""
    force_unit: "kgf"
    force_forward_sign: 1
    force_sample_max_age_sec: 0.25
    # Direct G10 raw-count defaults below use 50 counts and 10 samples (1 ms).
    # After kgf calibration, typical starting values are 0.03 kgf and 3 samples.
    force_change_threshold: 50.0
    force_sign_threshold: 50.0
    force_confirm_samples: 10
    force_latency_timeout_sec: 5.0

    # Reverse-engineered DET G10X.322 Ethernet stream. The Ubuntu G10 NIC must
    # be 192.168.127.55/24; the test bench sends from 192.168.127.56:5000 to
    # UDP port 4800. Use a second NIC -- never share the EtherCAT NIC.
    # G10 reception is GUI-owned; Motor Test never binds UDP 4800.
    g10_udp_enabled: false
    g10_bind_host: "0.0.0.0"
    g10_udp_port: 4800
    g10_device_ip: "192.168.127.56"
    g10_adc_channel: 6       # zero-based: wire ADC 7 is thrust on this G10
    # Measured ~100993.4 ns/sample on this G10 (not hardware-sync).
    g10_sample_period_ns: 100993
    g10_arrival_bias_ns: 0   # keep zero until measured with a hardware trigger
    g10_auto_zero: true
    g10_auto_zero_samples: 10000  # 1 s; bench must be unloaded at startup
    g10_zero_raw: 0.0
    g10_force_sign: -1
    # Hypothesis: signed-int16 UDP ADC wraps at +32767/-32768.
    # Use shortest modulo-65536 difference relative to the tare zero so
    # both physical directions can produce opposite signs. MUST validate
    # with unloaded, gentle manual push/pull and raw ADC traces.
    g10_adc_signed16_modulo: true
    g10_kgf_per_count: 0.0   # optional manual gain, overrides saved gain
    # Runtime services: /bidirectional_motor_test/g10_tare and g10_calibrate.
    # Save only gain to disk; each startup still needs a fresh zero.
    g10_load_calibration: true
    # ros2 launch overrides this with <colcon_workspace>/calibration/... .
    # Direct ros2 run still uses this HOME-relative fallback.
    g10_calibration_file: "~/bidirectional/calibration/g10_channel6.json"
    g10_calibration_mass_kg: 0.0   # set dynamically BEFORE g10_calibrate
    g10_stability_range_counts: 10.0
    g10_calibration_window_sec: 1.0
    # Onset/sign thresholds for direct G10 are ALWAYS in native ADC counts,
    # even after kgf calibration. The node converts these automatically.
    g10_raw_change_threshold: 50.0
    g10_raw_sign_threshold: 50.0
    g10_log_decimation: 40   # continuous force.csv ~250 Hz, event window native 10 kHz
    g10_channel_log_decimation: 4  # eight uncalibrated ADCs ~62 Hz for GUI
    # Ubuntu UDP stream health: block sine output until a calibrated/raw
    # fresh G10 stream is available, including auto-zero completion.
    # Set false ONLY for non-powered/no-prop command-path debugging.
    # Control is independent of G10; hardware/RPM stops remain essential.
    g10_require_healthy: false
    g10_no_packet_timeout_sec: 0.15
    g10_poll_rate_hz: 100.0
    g10_max_packets_per_poll: 6
    g10_max_queue_backlog: 24

    # Keep full-rate raw samples only around each first/reverse command.
    # Each window is written on a background thread after its post-history.
    g10_capture_raw_events: true
    g10_raw_pre_sec: 0.25
    g10_raw_post_sec: 0.75


    # ros2 launch resolves this from the installed colcon workspace, never
    # from root's HOME. For direct ros2 run, override this parameter yourself.
    log_directory: "~/bidirectional/measurements"
    command_meta_topic: "/bidirectional_motor_test/command_meta"
