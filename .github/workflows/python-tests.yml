name: Python logic checks

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Compile Python syntax
        run: python -m compileall -q bidirectional_motor_test tests launch
      - name: Run ROS-independent logic tests
        run: python -m unittest discover -s tests -v
